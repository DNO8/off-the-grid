[package]
name = "sozu-vault"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
soroban-sdk = { version = "=27.0.6", features = ["hazmat-address"] }
p256 = { version = "0.13", default-features = false, features = ["ecdsa"] }

[dev-dependencies]
soroban-sdk = { version = "=27.0.6", features = ["testutils"] }
serde_json = "1"
hex = "0.4"

[profile.release]
overflow-checks = true
